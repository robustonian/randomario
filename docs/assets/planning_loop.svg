<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#828ca0"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#101218"/>
  <text x="480" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">1回のリプラン(受動ホライズン制御)の流れ</text>

  <!-- steps -->
  <rect x="30" y="70" width="160" height="70" rx="10" fill="#1a1e28" stroke="#7c5cbf"/>
  <text x="110" y="98" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="bold">① snapshot</text>
  <text x="110" y="120" text-anchor="middle" fill="#c8d0dc" font-size="11">現在の状態を保存</text>

  <rect x="230" y="70" width="180" height="70" rx="10" fill="#1a1e28" stroke="#52607a"/>
  <text x="320" y="92" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">② 候補プラン生成</text>
  <text x="320" y="112" text-anchor="middle" fill="#c8d0dc" font-size="11">ダッシュ / ジャンプ掃引 / 待機</text>
  <text x="320" y="128" text-anchor="middle" fill="#c8d0dc" font-size="11">+ ビジョン由来の狙い撃ち候補</text>

  <rect x="450" y="70" width="200" height="70" rx="10" fill="#1a1e28" stroke="#fbbf24"/>
  <text x="550" y="92" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">③ ロールアウト評価</text>
  <text x="550" y="112" text-anchor="middle" fill="#c8d0dc" font-size="11">各候補を実際に70〜260F再生</text>
  <text x="550" y="128" text-anchor="middle" fill="#c8d0dc" font-size="11">→ restore で巻き戻し</text>

  <rect x="690" y="70" width="180" height="70" rx="10" fill="#1a1e28" stroke="#52607a"/>
  <text x="780" y="92" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">④ テール検証</text>
  <text x="780" y="112" text-anchor="middle" fill="#c8d0dc" font-size="11">上位候補だけ +90F 延長再生</text>
  <text x="780" y="128" text-anchor="middle" fill="#c8d0dc" font-size="11">「その先の死」を検知して減点</text>

  <line x1="190" y1="105" x2="230" y2="105" stroke="#828ca0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="105" x2="450" y2="105" stroke="#828ca0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="105" x2="690" y2="105" stroke="#828ca0" stroke-width="2" marker-end="url(#a)"/>

  <!-- escalation loop -->
  <path d="M 550 140 C 550 175 380 175 330 148" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="452" y="182" text-anchor="middle" fill="#f87171" font-size="11">全滅なら wave2/3 へエスカレーション(精密掃引・長待機・後退・ランダム)</text>

  <!-- execute -->
  <rect x="270" y="215" width="420" height="64" rx="10" fill="#12241a" stroke="#4ade80"/>
  <text x="480" y="241" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">⑤ 最良プランを実機で実行</text>
  <text x="480" y="262" text-anchor="middle" fill="#c8d0dc" font-size="11">生存が検証済みのフレーム数 − 安全マージン16F だけ進めて ①へ戻る</text>
  <line x1="780" y1="140" x2="690" y2="225" stroke="#4ade80" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M 270 247 C 90 247 60 180 100 143" fill="none" stroke="#828ca0" stroke-width="2" marker-end="url(#a)"/>
  <text x="118" y="215" text-anchor="middle" fill="#828ca0" font-size="11">再プラン</text>

  <!-- timeline -->
  <text x="480" y="322" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">タイムライン(例: 平常時)</text>
  <rect x="140" y="340" width="340" height="22" rx="4" fill="#2b5c3a"/>
  <text x="310" y="356" text-anchor="middle" fill="#d9fbe5" font-size="11">実行する区間 (検証済み, 〜54F)</text>
  <rect x="480" y="340" width="110" height="22" rx="4" fill="#4a4423"/>
  <text x="535" y="356" text-anchor="middle" fill="#f6e7ae" font-size="11">安全マージン</text>
  <rect x="590" y="340" width="230" height="22" rx="4" fill="#233046"/>
  <text x="705" y="356" text-anchor="middle" fill="#bcd3f5" font-size="11">テール +90F (dash継続と仮定)</text>
  <text x="140" y="390" fill="#828ca0" font-size="11">now</text>
  <text x="480" y="390" fill="#828ca0" font-size="11" text-anchor="middle">horizon−16F</text>
  <text x="590" y="390" fill="#828ca0" font-size="11" text-anchor="middle">horizon</text>
  <text x="820" y="390" fill="#828ca0" font-size="11" text-anchor="end">horizon+90F</text>
</svg>
