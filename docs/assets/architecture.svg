<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#828ca0"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#101218"/>
  <text x="480" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">RandoMario — モデルベース攻略AI 全体構成</text>

  <!-- Emulator -->
  <rect x="30" y="70" width="240" height="200" rx="10" fill="#1a1e28" stroke="#52607a"/>
  <text x="150" y="98" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold">NESエミュレータ (nes-py)</text>
  <rect x="50" y="115" width="200" height="38" rx="6" fill="#232838" stroke="#3a4358"/>
  <text x="150" y="139" text-anchor="middle" fill="#e2e8f0" font-size="12">画面バッファ (256×240 RGB)</text>
  <rect x="50" y="161" width="200" height="38" rx="6" fill="#232838" stroke="#3a4358"/>
  <text x="150" y="185" text-anchor="middle" fill="#e2e8f0" font-size="12">RAM (x座標・状態の直接読出し)</text>
  <rect x="50" y="207" width="200" height="38" rx="6" fill="#2a2438" stroke="#7c5cbf"/>
  <text x="150" y="231" text-anchor="middle" fill="#c4b5fd" font-size="12">セーブステート (Backup/Restore)</text>

  <!-- Vision -->
  <rect x="330" y="70" width="270" height="130" rx="10" fill="#1a1e28" stroke="#52607a"/>
  <text x="465" y="98" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="bold">ビジョン (vision.py)</text>
  <text x="465" y="122" text-anchor="middle" fill="#c8d0dc" font-size="12">スクロール補償フレーム差分</text>
  <text x="465" y="142" text-anchor="middle" fill="#c8d0dc" font-size="12">ブロブ追跡 → 位置・速度・加速度</text>
  <text x="465" y="162" text-anchor="middle" fill="#c8d0dc" font-size="12">穴(ピット)検出・足場エッジ検出</text>
  <text x="465" y="184" text-anchor="middle" fill="#828ca0" font-size="11">→ hints(敵/穴/エッジ/マリオ速度)</text>

  <!-- Planner -->
  <rect x="330" y="230" width="270" height="200" rx="10" fill="#1a1e28" stroke="#fbbf24"/>
  <text x="465" y="258" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="bold">プランナー (planner.py)</text>
  <text x="465" y="284" text-anchor="middle" fill="#c8d0dc" font-size="12">① 候補プラン生成 (wave 1→2→3)</text>
  <text x="465" y="304" text-anchor="middle" fill="#c8d0dc" font-size="12">② セーブステートで先読みロールアウト</text>
  <text x="465" y="324" text-anchor="middle" fill="#c8d0dc" font-size="12">③ スコアリング (前進 / 旗 / 死 / ワープ)</text>
  <text x="465" y="344" text-anchor="middle" fill="#c8d0dc" font-size="12">④ テール検証 (ホライズン先の死を検知)</text>
  <text x="465" y="364" text-anchor="middle" fill="#c8d0dc" font-size="12">⑤ 最良プランを実機で実行</text>
  <text x="465" y="392" text-anchor="middle" fill="#828ca0" font-size="11">エッジジャンプ・水泳・リフト乗り継ぎ</text>
  <text x="465" y="410" text-anchor="middle" fill="#828ca0" font-size="11">ランダム複合候補 (スタック脱出)</text>

  <!-- Memory -->
  <rect x="660" y="230" width="270" height="200" rx="10" fill="#1a1e28" stroke="#f87171"/>
  <text x="795" y="258" text-anchor="middle" fill="#f87171" font-size="15" font-weight="bold">死亡分析メモリ (memory.py)</text>
  <text x="795" y="284" text-anchor="middle" fill="#c8d0dc" font-size="12">死因分類: 穴 / 敵 / 接触 / 時間切れ</text>
  <text x="795" y="304" text-anchor="middle" fill="#c8d0dc" font-size="12">ハザードDB (ステージ×座標×回数)</text>
  <text x="795" y="324" text-anchor="middle" fill="#c8d0dc" font-size="12">プラン・ブラックリスト (責任ウィンドウ)</text>
  <text x="795" y="344" text-anchor="middle" fill="#c8d0dc" font-size="12">失敗レーン記録 (ループ迷路)</text>
  <text x="795" y="372" text-anchor="middle" fill="#828ca0" font-size="11">SQLite: db/planner.sqlite (WAL)</text>
  <text x="795" y="392" text-anchor="middle" fill="#828ca0" font-size="11">エピソード結果・クリア記録も保存</text>

  <!-- Agent loop -->
  <rect x="660" y="70" width="270" height="130" rx="10" fill="#1a1e28" stroke="#52607a"/>
  <text x="795" y="98" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold">エージェントループ (agent_planner.py)</text>
  <text x="795" y="122" text-anchor="middle" fill="#c8d0dc" font-size="12">エピソード管理・実行</text>
  <text x="795" y="142" text-anchor="middle" fill="#c8d0dc" font-size="12">スタック / ワープ / ループ検出</text>
  <text x="795" y="162" text-anchor="middle" fill="#c8d0dc" font-size="12">死亡時の責任割当て → メモリ更新</text>

  <!-- UI / Dashboard -->
  <rect x="30" y="470" width="570" height="70" rx="10" fill="#1a1e28" stroke="#52607a"/>
  <text x="315" y="497" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">UI (ui.py) — 可変速度 1x〜MAX・コントローラ・ビジョンオーバーレイ</text>
  <text x="315" y="520" text-anchor="middle" fill="#828ca0" font-size="11">速度は描画とウェイトのみ変更 — エミュレーション精度は不変</text>

  <rect x="660" y="470" width="270" height="70" rx="10" fill="#1a1e28" stroke="#52607a"/>
  <text x="795" y="497" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">比較ダッシュボード</text>
  <text x="795" y="520" text-anchor="middle" fill="#828ca0" font-size="11">Random(pkl/) vs Planner(sqlite) を並列表示</text>

  <!-- arrows -->
  <line x1="270" y1="135" x2="330" y2="135" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="125" text-anchor="middle" fill="#828ca0" font-size="10">フレーム</text>
  <line x1="330" y1="330" x2="270" y2="240" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowY)"/>
  <text x="266" y="292" text-anchor="middle" fill="#fbbf24" font-size="10">snapshot /</text>
  <text x="266" y="305" text-anchor="middle" fill="#fbbf24" font-size="10">rollout / restore</text>
  <line x1="465" y1="200" x2="465" y2="230" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="330" x2="660" y2="330" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="350" x2="600" y2="350" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="320" text-anchor="middle" fill="#828ca0" font-size="10">照会</text>
  <text x="630" y="368" text-anchor="middle" fill="#828ca0" font-size="10">学習</text>
  <line x1="795" y1="200" x2="795" y2="230" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="120" x2="600" y2="120" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="110" text-anchor="middle" fill="#828ca0" font-size="10">hints</text>
  <line x1="315" y1="440" x2="315" y2="470" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="795" y1="440" x2="795" y2="470" stroke="#828ca0" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
